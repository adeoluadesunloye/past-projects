<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Custom Radio Buttons | CodingMaker</title>
   
   
     

     
   
</head>
<body>
  <div class="wrapper">
    <div class="title">Choose your size:</div>
    <div class="box">
      <input type="radio" name="select" id="option-1">
      <input type="radio" name="select" id="option-2">
      <input type="radio" name="select" id="option-3">
      <input type="radio" name="select" id="option-4">
      <label for="option-1" class="option-1">
        <div class="dot"></div>
        <div class="text">Jar, 1/2 Cup, 2.5 oz.  <strong>$8.99</strong></div>
      </label>
      <label for="option-2" class="option-2">
        <div class="dot"></div>
        <div class="text">Bag, 8 oz. <strong>$19.99</strong></div>
      </label>
      <label for="option-3" class="option-3">
        <div class="dot"></div>
        <div class="text">Flatpack, 1/2 Cup <strong>$8.79</strong></div>
      </label>
    </div>
  </div>

</body>
</html>
