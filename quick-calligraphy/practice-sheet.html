<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice sheet | QuickCalligraphy</title>
<link href="https://fonts.googleapis.com/css2?family=Tangerine:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Poppins,Arial,sans-serif;background:#f4f1ea;color:#222}
header{background:#111;color:#f5c518;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
header a,button{color:#111;background:#f5c518;border:0;padding:8px 16px;border-radius:4px;text-decoration:none;font-weight:600;cursor:pointer;font-family:inherit}
.sheet{max-width:800px;margin:24px auto;background:#fff;padding:28px 32px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
h1{margin:0 0 4px}p{margin:0 0 18px;color:#555}
.row{position:relative;height:90px;margin-bottom:18px;border-top:1px solid #bbb;border-bottom:1px solid #bbb;
 background:linear-gradient(#ddd,#ddd) 0 30px/100% 1px no-repeat,linear-gradient(#ddd,#ddd) 0 60px/100% 1px no-repeat,
 repeating-linear-gradient(55deg,transparent 0 38px,#eee 38px 39px)}
.row span{position:absolute;left:8px;bottom:6px;font-family:Tangerine,cursive;font-size:84px;line-height:1;color:#c9c9c9;letter-spacing:6px;white-space:nowrap;overflow:hidden;right:8px}
@media print{header{display:none}.sheet{box-shadow:none;margin:0;max-width:none}body{background:#fff}}
</style></head><body>
<header><strong>QuickCalligraphy</strong><span><button onclick="window.print()">Print or save as PDF</button> <a href="index.html">Back to home</a></span></header>
<div class="sheet">
<h1>Practice sheet</h1>
<p>Trace the grey letters, then fill the empty rows. Keep your strokes at the slant of the guide lines. Print it, or save it as a PDF from the print dialog.</p>
<div class="row"><span>a b c d e f g h i</span></div>
<div class="row"><span>j k l m n o p q r</span></div>
<div class="row"><span>s t u v w x y z</span></div>
<div class="row"><span>A B C D E F G H</span></div>
<div class="row"><span>Practice makes progress</span></div>
<div class="row"></div><div class="row"></div><div class="row"></div>
</div>
</body></html>
