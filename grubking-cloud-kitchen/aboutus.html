<!doctype html>
<html>
<head>


		<style>
   
            .hi-slide { position: relative;
                width: 754px; height: 292px;
                margin: 115px auto 0; }
               
                .hi-slide .hi-next,
                .hi-slide .hi-prev 
            { position: absolute;
              top: 50%; 
              width: 40px;
              height: 40px; 
              margin-top: -20px;     
                border-radius: 50px; 
                 
                
              line-height: 40px;
              text-align: center; 
              cursor: pointer;
              background-color: #fff; 
              color: black;               
              transition: all 0.6s;
              font-size: 20px; 
                font-weight: bold;
            }
           .hi-slide .hi-next:hover, 
            .hi-slide .hi-prev:hover 
            {
            opacity: 1; 
            background-color: #fff;  
            }
            
           .hi-slide .hi-prev { left: -60px; }
            
    .hi-slide .hi-prev::before { content: '<'; }
    .hi-slide .hi-next { right: -60px; }
    .hi-slide .hi-next::before { content: '>'; }
    
            .hi-slide > ul
                    { 
                        list-style: none; 
                        position: relative;
                        width: 754px; 
                        height: 292px; 
                        margin: 0;
                        padding: 0;
            }
            
            
        .hi-slide > ul > li {
            overflow: hidden; 
            position: absolute; 
            z-index: 0; 
            left: 377px;
            top: 146px; 
            width: 0; 
            height: 0; 
            margin: 0; 
            padding: 0;
            border: 3px solid #fff;              
            background-color: #333; 
            cursor: pointer; }
            
        .hi-slide > ul > li > img { width: 100%;
            height: 100%;
            object-fit: cover;
            }

 

		</style>
	</head>
	<body>

		<div class="slide hi-slide">
		  <div class="hi-prev "></div>
			<div class="hi-next "></div>
			<ul>
				<li>
				<img src="photos/coconutrice.jpg" alt="Img 1" /></li>
				<li><img src="photos/ofada.jpg" alt="Img 2" /></li>
				<li><img src="photos/papandakara.jpg" alt="Img 3" /></li>
				<li><img src="photos/breadsticks.jpg" alt="Img 4" /></li>
				<li><img src="photos/smallchops.jpg" alt="Img 5" /></li>
				<li><img src="photos/jollofandmoinmoin.jpeg" alt="Img 6" /></li>
				<li><img src="photos/smokedbbq.jpg" alt="Img 7" /></li>
                <li><img src="photos/meatpie.jpg" alt="Img 7" /></li>
			</ul>
		</div>
		
		
		
	<script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
		<script type="text/javascript" src="aboutus.js" ></script>
		<script>
			$('.slide').hiSlide();
		</script>
	</body>
    
</html>
