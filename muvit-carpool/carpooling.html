 <a id="Carpoolingrules"></a>
            <h1 style="text-align: center; padding-bottom: 10px; "><strong>CARPOOLING RULES</strong></h1>
 <!-- Container for the image gallery -->
 <div class="container" id="carpooling">
     
  <!-- Full-width images with number text -->
  <div class="mySlides">
    <div class="numbertext">1 / 5</div>
      <img src="drinkdrive.jpg" style="width:100%">
  </div>

  <div class="mySlides">
    <div class="numbertext">2 / 5</div>
      <img src="speed.jpg" style="width:100%">
  </div>

  <div class="mySlides">
    <div class="numbertext">3 / 5</div>
      <img src="Traffic signs.jpg" style="width:100%">
  </div>

  <div class="mySlides">
    <div class="numbertext">4 / 5</div>
      <img src="Traffic Warning  (1).png" style="width:100%">
  </div>

  <div class="mySlides">
    <div class="numbertext">5 / 5</div>
      <img src="Masks.jpg" style="width:100%">
  </div>

  <!-- Next and previous buttons -->
  <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
  <a class="next" onclick="plusSlides(1)">&#10095;</a>

  <!-- Image text -->
  <div class="caption-container">
    <p id="caption"></p>
  </div>

  <!-- Thumbnail images -->
  <div class="row">
    <div class="column">
      <img class="demo cursor" src="Images/drinkdrive.jpg" style="width:50%" onclick="currentSlide(1)" alt="Don't Drink and Drive">
    </div>
    <div class="column">
      <img class="demo cursor" src="Images/speed.jpg" style="width:50%" onclick="currentSlide(2)" alt="Observe Speed Limits">
    </div>
    <div class="column">
      <img class="demo cursor" src="Images/Traffic%20signs.jpg" style="width:50%" onclick="currentSlide(3)" alt="Traffic Signs">
    </div>
    <div class="column">
      <img class="demo cursor" src="Images/Traffic%20Warning%20%20(1).png" style="width:50%" onclick="currentSlide(4)" alt="Traffic Warnings">
    </div>
    <div class="column">
      <img class="demo cursor" src="Images/Masks.jpg" style="width:50%" onclick="currentSlide(5)" alt="Always Wear your Masks">
    </div>
  </div>
</div>
 <script>
var slideIndex = 1;
showSlides(slideIndex);

// Next/previous controls
function plusSlides(n) {
  showSlides(slideIndex += n);
}

// Thumbnail image controls
function currentSlide(n) {
  showSlides(slideIndex = n);
}

function showSlides(n) {
  var i;
  var slides = document.getElementsByClassName("mySlides");
  var dots = document.getElementsByClassName("demo");
  var captionText = document.getElementById("caption");
  if (n > slides.length) {slideIndex = 1}
  if (n < 1) {slideIndex = slides.length}
  for (i = 0; i < slides.length; i++) {
    slides[i].style.display = "none";
  }
  for (i = 0; i < dots.length; i++) {
    dots[i].className = dots[i].className.replace(" active", "");
  }
  slides[slideIndex-1].style.display = "block";
  dots[slideIndex-1].className += " active";
  captionText.innerHTML = dots[slideIndex-1].alt;
}
</script>
